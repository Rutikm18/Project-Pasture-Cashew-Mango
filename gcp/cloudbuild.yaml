# Cloud Build CI/CD — builds image and deploys to Cloud Run
# Region: asia-south1 (Mumbai) — closest to Ratnagiri customers
# Trigger this via Cloud Build GitHub trigger or: gcloud builds submit

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pashure:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pashure:latest'
      - '.'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pashure:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pashure:latest']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pashure'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pashure:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--set-env-vars'
      - 'NODE_ENV=production,ADMIN_SECRET=${_ADMIN_SECRET}'
      - '--project'
      - '$PROJECT_ID'

images:
  - 'gcr.io/$PROJECT_ID/pashure:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/pashure:latest'

options:
  logging: CLOUD_LOGGING_ONLY
